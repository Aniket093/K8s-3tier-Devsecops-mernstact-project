apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: backend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
      - name: backend

        image: 401045966536.dkr.ecr.ap-south-1.amazonaws.com/backend-repo:latest

        ports:
        - containerPort: 5000

        env:
        - name: MONGO_URI
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: MONGO_URI